events {}

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    include /etc/nginx/mime.types;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # otalon-ui / otalon-api are resolved at REQUEST time (not at nginx
    # config-load time) via Docker's embedded DNS (127.0.0.11). A container
    # restart after a full host reboot races Compose's `depends_on` ordering
    # (which the Docker daemon does not honor on daemon-driven restarts), so
    # nginx must not fail to start just because otalon-ui/otalon-api are not
    # yet resolvable. See otalon-suite AGENTS.md "Container fixes" section.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # otalon-capture deliberately uses host networking for raw capture; the
    # proxy reaches its published recorder port through the Docker host gateway.
    upstream pcap { server host.docker.internal:9090; }

    # Loopback-only liveness endpoint (SUITE-052). It is bound inside the
    # container network namespace and never published, so it adds no external
    # surface. A probe against it proves the nginx worker processes accept and
    # answer requests — unlike `nginx -t`, which only re-parses the config in a
    # separate process. It must not proxy to an upstream: the proxy starts
    # without otalon-ui/otalon-api by design, and upstream coupling would make
    # a healthy proxy look dead during a UI restart.
    server {
        listen 127.0.0.1:8099;
        server_name _;
        access_log off;
        default_type text/plain;
        location = /healthz {
            return 200 "ok\n";
        }
    }

    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        add_header Strict-Transport-Security "max-age=31536000" always;
        location / {
            set $ui_upstream http://otalon-ui:8080;
            proxy_pass $ui_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    server {
        listen 8493 ssl;
        server_name _;
        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        add_header Strict-Transport-Security "max-age=31536000" always;
        location / {
            set $api_upstream http://otalon-api:8090;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 120s;
            proxy_buffering off;
        }
    }

    server {
        listen 9493 ssl;
        server_name _;
        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        add_header Strict-Transport-Security "max-age=31536000" always;
        location / {
            proxy_pass http://pcap;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
