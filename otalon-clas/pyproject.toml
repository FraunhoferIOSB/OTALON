[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "otalon-clas"
version = "0.1.0"
description = "Config-driven ML anomaly detection pipeline for ICS network monitoring"
requires-python = ">=3.13"
dependencies = [
    "otalon-common",
    "pydantic==2.9.2",
    "polars==1.44.1",
    "pandas==2.3.3",
    "loguru==0.7.2",
    "influxdb3-python==0.17.0",
    "psycopg2-binary==2.9.10",
    "sqlalchemy==2.0.36",
    "scikit-learn==1.7.2",
    "joblib==1.5.2",
    "numpy==2.3.5",
    "httpx==0.27.2",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
xgboost = ["xgboost==3.3.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.4",
    "isort>=5.0",
    "mypy>=1.10",
]

[tool.black]
line-length = 120
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["otalon_clas", "cyberclas_ics_next", "cyberclas_ics"]

[tool.setuptools]
py-modules = ["cyberclas_ics_next", "cyberclas_ics"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
# SUITE-032 folded the standalone ``pytest.ini`` in here; every key is
# transcribed verbatim. The removed file declared only ``markers`` — no
# ``testpaths`` and no ``pythonpath`` — so nothing else is added here.
markers = [
    "golden: Golden tests comparing pipeline stages against frozen production data",
    "smoke: End-to-end smoke tests running the full pipeline on small data slices",
    "unit: Unit tests for individual components",
]
